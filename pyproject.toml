[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saas-signal-bands"
version = "0.1.0"
description = "Bollinger-style signal bands for SaaS metrics"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
